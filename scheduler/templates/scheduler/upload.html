{% extends "base.html" %}
{% block content %}
    <div class="container mt-4">
        <h2>Upload or Paste Kronos Schedule JSON</h2>
        <form method="post" enctype="multipart/form-data" class="mt-3">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Import Schedule</button>
        </form>
    </div>
{% endblock %}
